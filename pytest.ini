[pytest]
# Configuration pytest pour le projet Triangulator

# Répertoires de tests
testpaths = tests

# Patterns de découverte des fichiers de tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers personnalisés
markers =
    perf: tests de performance (exclus par défaut avec -m 'not perf')
    slow: tests très lents (peuvent être exclus même en mode perf)

# Options par défaut
addopts =
    -v
    --strict-markers
    --tb=short

# Filtrer les warnings
filterwarnings =
    ignore::DeprecationWarning
